# Pipeline multi-applications — ITE-281
# 5 scénarios DemoWebShop (Tricentis) + 4 scénarios AutomationExercise
# Lancé via : npm run generate:scenarios -- -f test-scenarios/multi-app.yaml

scenarios:

  # ─────────────────────────────────────────────────────────────────
  # Application 1 : DemoWebShop by Tricentis (https://demowebshop.tricentis.com)
  # Site e-commerce de démonstration .NET / NopCommerce
  # ─────────────────────────────────────────────────────────────────
  - name: "DemoWebShop - Homepage et navigation par catégorie"
    url: "https://demowebshop.tricentis.com"
    prompt: |
      Naviguer vers https://demowebshop.tricentis.com/.
      Vérifier que la page d'accueil s'affiche avec le titre 'Demo Web Shop'.
      Vérifier que la barre de navigation principale contient au moins les catégories 'Books' et 'Computers'.
      Cliquer sur la catégorie 'Books'.
      Vérifier que la page liste de produits Books s'affiche avec au moins un produit visible.

  - name: "DemoWebShop - Recherche de produit"
    url: "https://demowebshop.tricentis.com"
    prompt: |
      Naviguer vers https://demowebshop.tricentis.com/.
      Utiliser le champ de recherche (input#small-searchterms ou champ de recherche du header) pour chercher 'computer'.
      Soumettre la recherche (touche Entrée ou bouton Search).
      Vérifier que la page de résultats s'affiche avec au moins un produit dont le nom contient 'computer' ou 'laptop' ou 'notebook'.
      Vérifier que le nombre de résultats est affiché.

  - name: "DemoWebShop - Ajout au panier depuis la liste"
    url: "https://demowebshop.tricentis.com"
    prompt: |
      Naviguer vers https://demowebshop.tricentis.com/books.
      Attendre que la liste de produits Books soit visible.
      Cliquer sur le premier produit de la liste pour accéder à sa page détail.
      Vérifier que le prix est visible sur la page détail.
      Cliquer sur le bouton 'Add to cart'.
      Vérifier que le compteur du panier dans le header (lien Shopping cart avec nombre d'articles) est mis à jour (ex: (1)).

  - name: "DemoWebShop - Inscription d'un nouveau compte"
    url: "https://demowebshop.tricentis.com"
    prompt: |
      Naviguer vers https://demowebshop.tricentis.com/register.
      Vérifier que le formulaire d'inscription est visible avec les champs First name, Last name, Email, Password.
      Remplir le formulaire : First name 'Test', Last name 'User', Email 'testuser.ite281@mailinator.com',
      Password 'Test1234!', Confirm password 'Test1234!'.
      Cocher la case 'Female' ou 'Male' si présente.
      Cliquer sur le bouton 'Register'.
      Vérifier qu'un message de confirmation s'affiche (ex: 'Your registration completed' ou redirection vers la homepage avec utilisateur connecté).

  - name: "DemoWebShop - Panier et récapitulatif de commande"
    url: "https://demowebshop.tricentis.com"
    prompt: |
      Naviguer vers https://demowebshop.tricentis.com/electronics/camera-photo.
      Attendre que la liste de produits soit visible.
      Cliquer sur le premier produit de la liste.
      Cliquer sur 'Add to cart' sur la page détail du produit.
      Naviguer vers https://demowebshop.tricentis.com/cart.
      Vérifier que le panier n'est pas vide : au moins une ligne produit est visible avec nom, prix et quantité.
      Vérifier que le sous-total (Sub-Total ou Order Total) est affiché.

  # ─────────────────────────────────────────────────────────────────
  # Application 2 : AutomationExercise (https://automationexercise.com)
  # Site e-commerce de pratique pour l'automatisation de tests
  # ─────────────────────────────────────────────────────────────────
  - name: "AutomationExercise - Homepage et navigation"
    url: "https://automationexercise.com"
    prompt: |
      Naviguer vers https://automationexercise.com.
      Vérifier que la homepage s'affiche avec le logo 'Automation Exercise'.
      Vérifier que la barre de navigation contient les liens Home, Products, Cart, Signup/Login.
      Cliquer sur 'Products' et vérifier que la liste de produits s'affiche avec au moins 5 produits.

  - name: "AutomationExercise - Recherche produit"
    url: "https://automationexercise.com"
    prompt: |
      Naviguer vers https://automationexercise.com/products.
      Utiliser le champ de recherche pour chercher 'dress'.
      Cliquer sur le bouton Search.
      Vérifier que la section 'Searched Products' s'affiche avec des résultats contenant 'dress' dans le nom.
      Vérifier qu'au moins un produit est affiché dans les résultats.

  - name: "AutomationExercise - Ajout au panier"
    url: "https://automationexercise.com"
    prompt: |
      Naviguer vers https://automationexercise.com/products.
      Localiser le premier produit visible dans la liste.
      Utiliser page.locator('.product-image-wrapper').first() pour identifier le premier produit.
      Cliquer sur le lien 'View Product' du premier produit pour accéder à sa page détail.
      Sur la page détail, cliquer sur le bouton 'Add to cart'.
      Naviguer vers https://automationexercise.com/view_cart.
      Vérifier que le produit apparaît dans le panier avec son nom et son prix.

  - name: "AutomationExercise - Inscription nouveau compte"
    url: "https://automationexercise.com"
    prompt: |
      Naviguer vers https://automationexercise.com/login.
      Vérifier que le formulaire 'New User Signup!' est visible avec les champs Name et Email Address.
      Remplir le formulaire avec name 'Test User' et email 'testuser_ite281@example.com'.
      Cliquer sur le bouton 'Signup'.
      Vérifier que la page de détails du compte s'affiche avec le titre 'Enter Account Information'.
