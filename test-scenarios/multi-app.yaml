# Pipeline multi-applications — ITE-281
# Les sélecteurs canoniques sont dans src/system-prompt.ts (buildSystemPrompt).
# Les prompts YAML décrivent le COMPORTEMENT — le système prompt injecte les sélecteurs.
# Lancé via : npm run generate:scenarios -- -f test-scenarios/multi-app.yaml

scenarios:

  # ─────────────────────────────────────────────────────────────────
  # Application 1 : DemoWebShop by Tricentis
  # Sélecteurs dans DEMOWEBSHOP_SYSTEM_PROMPT (system-prompt.ts)
  # ─────────────────────────────────────────────────────────────────

  - name: "DemoWebShop - Homepage et navigation par catégorie"
    url: "https://demowebshop.tricentis.com"
    prompt: |
      Naviguer vers https://demowebshop.tricentis.com/.
      Vérifier que le titre de page est 'Demo Web Shop'.
      Vérifier que la navigation (.top-menu) contient 'Books' et 'Computers'.
      Cliquer sur le lien Books dans le top-menu.
      Vérifier que la page Books s'affiche (h1 contient 'Books').
      Vérifier qu'au moins un produit est visible dans .product-grid .item-box.

  - name: "DemoWebShop - Recherche de produit"
    url: "https://demowebshop.tricentis.com"
    prompt: |
      Naviguer vers https://demowebshop.tricentis.com/.
      Utiliser le champ input#small-searchterms pour chercher 'computer'.
      Appuyer sur Entrée pour lancer la recherche.
      Vérifier que l'URL contient 'search' ou 'q=computer'.
      Vérifier qu'au moins un produit est visible dans les résultats (.product-grid .item-box).

  - name: "DemoWebShop - Ajout au panier depuis la liste"
    url: "https://demowebshop.tricentis.com"
    prompt: |
      Naviguer vers https://demowebshop.tricentis.com/books.
      Vérifier qu'au moins un produit est visible (.product-grid .item-box).
      Cliquer sur le titre du premier produit (.product-grid .item-box .product-title a).
      Vérifier que le prix du produit est visible sur la page détail (.actual-price).
      Cliquer sur le bouton Add to cart (input[value="Add to cart"]).
      Vérifier que le badge panier (.cart-qty) ne contient plus '(0)'.

  - name: "DemoWebShop - Inscription d'un nouveau compte"
    url: "https://demowebshop.tricentis.com"
    prompt: |
      Naviguer vers https://demowebshop.tricentis.com/register.
      Vérifier que les champs #FirstName, #LastName, #Email, #Password sont visibles.
      Remplir le formulaire : FirstName='Test', LastName='User',
        Email=utiliser un email unique dynamique avec Date.now() (ex: test${Date.now()}@mailinator.com),
        Password='Test1234!', ConfirmPassword='Test1234!'.
      Cliquer sur le bouton input[value="Register"].
      Vérifier le message de confirmation 'Your registration completed'.

  - name: "DemoWebShop - Panier et récapitulatif de commande"
    url: "https://demowebshop.tricentis.com"
    prompt: |
      Naviguer vers https://demowebshop.tricentis.com/computers.
      Vérifier qu'au moins un produit est visible dans .product-grid .item-box.
      Cliquer sur le titre du premier produit (.product-grid .item-box .product-title a).
      Vérifier que le prix du produit est visible sur la page détail (.actual-price).
      Cliquer sur le bouton Add to cart (input[value="Add to cart"]).
      Attendre que le badge panier (.cart-qty) ne contienne plus '(0)' avant de continuer.
      Naviguer vers https://demowebshop.tricentis.com/cart.
      Vérifier qu'au moins une ligne produit est présente (.cart > tbody > tr).
      Vérifier que le total de commande est affiché (.cart-total).

  # ─────────────────────────────────────────────────────────────────
  # Application 2 : AutomationExercise
  # Sélecteurs dans AUTOMATIONEXERCISE_SYSTEM_PROMPT (system-prompt.ts)
  # ─────────────────────────────────────────────────────────────────

  - name: "AutomationExercise - Homepage et navigation"
    url: "https://automationexercise.com"
    prompt: |
      Naviguer vers https://automationexercise.com.
      Vérifier que le lien Home est visible dans la navbar (ul.nav.navbar-nav li a[href="/"]).
      Vérifier que le lien Products est visible (ul.nav.navbar-nav li a[href="/products"]).
      Cliquer sur le lien Products.
      Vérifier qu'au moins un produit est visible dans .features_items (.col-sm-4.first()).

  - name: "AutomationExercise - Recherche produit"
    url: "https://automationexercise.com"
    prompt: |
      Naviguer vers https://automationexercise.com/products.
      Remplir le champ input#search_product avec 'dress'.
      Cliquer sur le bouton button#submit_search.
      Vérifier que la section 'Searched Products' est visible (h2.title.text-center).
      Vérifier qu'au moins un produit est affiché dans les résultats.

  - name: "AutomationExercise - Ajout au panier"
    url: "https://automationexercise.com"
    prompt: |
      Naviguer vers https://automationexercise.com/products.
      Cliquer sur le lien 'View Product' du premier produit (getByRole link 'View Product' first).
      Vérifier que la page détail s'affiche (.product-information h2 visible).
      Cliquer sur le bouton Add to cart (button.cart).
      Attendre que le modal apparaisse (#cartModal ou .modal-dialog).
      Cliquer sur le lien 'View Cart' dans le modal (.modal-dialog a[href="/view_cart"]).
      Vérifier qu'au moins une ligne produit est dans le panier (#cart_info_table tbody tr).

  - name: "AutomationExercise - Inscription nouveau compte"
    url: "https://automationexercise.com"
    prompt: |
      Naviguer vers https://automationexercise.com/login.
      Vérifier que le titre du formulaire signup est 'New User Signup!' (.signup-form h2).
      Remplir input[data-qa="signup-name"] avec 'Test User'.
      Remplir input[data-qa="signup-email"] avec 'testuser_ite281@example.com'.
      Cliquer sur button[data-qa="signup-button"].
      Vérifier que la page suivante affiche 'Enter Account Information'
        (h2.title.text-center.first() ou page.locator('h2.title').first()).
