name: Multi-App Pipeline (YAML + GitHub Models)

on:
  workflow_dispatch:
    inputs:
      scenarios_file:
        description: "Fichier YAML de scénarios"
        required: false
        default: "test-scenarios/multi-app.yaml"
      model:
        description: "Modèle GitHub Models à utiliser"
        required: false
        default: "gpt-4o-mini"
  push:
    branches: [main]
    paths:
      - "test-scenarios/multi-app.yaml"
      - "src/**"

permissions:
  contents: read
  models: read
  checks: write

jobs:
  generate-and-test:
    name: Génération YAML + Playwright (multi-app)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_MODEL: ${{ github.event.inputs.model || 'gpt-4o-mini' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Playwright (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Générer les specs depuis le fichier YAML
        run: |
          SCENARIOS_FILE="${{ github.event.inputs.scenarios_file || 'test-scenarios/multi-app.yaml' }}"
          echo "→ Génération depuis $SCENARIOS_FILE (modèle: $GITHUB_MODEL)"
          npm run generate:scenarios -- -f "$SCENARIOS_FILE" --out-dir tests/multi-app
          echo ""
          echo "=== Specs générés ==="
          ls -la tests/multi-app/

      - name: Afficher les specs générés
        run: |
          for f in tests/multi-app/*.spec.ts; do
            echo ""
            echo "--- $f ---"
            cat "$f"
          done

      - name: Exécuter les tests Playwright (multi-app)
        env:
          CI: true
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/junit.xml
        run: npx playwright test tests/multi-app/ --reporter=list,html,junit
        continue-on-error: true

      - name: Publier résultats de tests (GitHub Checks)
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "test-results/junit.xml"
          check_name: "Playwright — Multi-App Results"
          fail_on_failure: false
          include_passed: true
          detailed_summary: true
          annotate_only: false

      - name: Upload rapport Playwright HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-multi-app-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Upload screenshots des tests échoués
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_number }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Résumé
        if: always()
        run: |
          echo "## Multi-App Pipeline — GitHub Models" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Modèle :** \`$GITHUB_MODEL\`" >> $GITHUB_STEP_SUMMARY
          echo "**Fichier scénarios :** \`${{ github.event.inputs.scenarios_file || 'test-scenarios/multi-app.yaml' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          SPECS=$(ls tests/multi-app/*.spec.ts 2>/dev/null | wc -l)
          echo "**${SPECS} specs générés :**" >> $GITHUB_STEP_SUMMARY
          for f in tests/multi-app/*.spec.ts; do
            echo "- \`$(basename $f)\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Applications testées :**" >> $GITHUB_STEP_SUMMARY
          echo "- DemoWebShop Tricentis (https://demowebshop.tricentis.com) — 5 scénarios" >> $GITHUB_STEP_SUMMARY
          echo "- AutomationExercise (https://automationexercise.com) — 4 scénarios" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/junit.xml ]; then
            PASSED=$(grep -o 'tests="[0-9]*"' test-results/junit.xml | head -1 | grep -o '[0-9]*' || echo "?")
            FAILED=$(grep -o 'failures="[0-9]*"' test-results/junit.xml | head -1 | grep -o '[0-9]*' || echo "?")
            echo "**Résultats Playwright :** ${PASSED} tests, ${FAILED} échec(s)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Aucun secret externe requis — utilise uniquement GITHUB_TOKEN." >> $GITHUB_STEP_SUMMARY
