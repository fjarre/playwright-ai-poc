name: Demo Playwright x AI

on:
  workflow_dispatch:
    inputs:
      prompt_1:
        description: "Prompt test 1"
        required: false
        default: "Tester que le login fonctionne avec standard_user et secret_sauce"
      prompt_2:
        description: "Prompt test 2"
        required: false
        default: "Vérifier qu'on peut ajouter un produit au panier et voir le total"
      prompt_3:
        description: "Prompt test 3 (checkout)"
        required: false
        default: "Tester le processus de checkout complet jusqu'à la confirmation"

jobs:
  generate-and-test:
    name: Génération IA + Exécution Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Installer les dépendances
        run: npm ci

      - name: Installer Playwright (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Générer test 1 via Claude AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run generate -- --prompt "${{ github.event.inputs.prompt_1 }}" --out tests/generated-1.spec.ts
          echo "=== Test généré (1) ==="
          cat tests/generated-1.spec.ts

      - name: Générer test 2 via Claude AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run generate -- --prompt "${{ github.event.inputs.prompt_2 }}" --out tests/generated-2.spec.ts
          echo "=== Test généré (2) ==="
          cat tests/generated-2.spec.ts

      - name: Générer test 3 via Claude AI
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run generate -- --prompt "${{ github.event.inputs.prompt_3 }}" --out tests/generated-3.spec.ts
          echo "=== Test généré (3) ==="
          cat tests/generated-3.spec.ts

      - name: Exécuter tous les tests Playwright
        env:
          CI: true
        run: npm test

      - name: Upload rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Résumé
        if: always()
        run: |
          echo "## Résultat Demo Playwright x AI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Prompts utilisés :**" >> $GITHUB_STEP_SUMMARY
          echo "1. ${{ github.event.inputs.prompt_1 }}" >> $GITHUB_STEP_SUMMARY
          echo "2. ${{ github.event.inputs.prompt_2 }}" >> $GITHUB_STEP_SUMMARY
          echo "3. ${{ github.event.inputs.prompt_3 }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 Le rapport HTML Playwright est disponible dans les artifacts." >> $GITHUB_STEP_SUMMARY
